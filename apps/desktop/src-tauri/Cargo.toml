[package]
name = "scopehub-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scopehub]
check_platform = "windows-x64"
portable_test_lib = true

[features]
portable-test-bridge = []
ubuntu-desktop = ["dep:rfd", "dep:tauri", "dep:tauri-build"]

[[example]]
name = "local_import_bridge"
required-features = ["portable-test-bridge"]

[dependencies]
scopehub-application = { path = "../../../crates/application" }
scopehub-domain = { path = "../../../crates/domain" }
scopehub-persistence = { path = "../../../crates/persistence" }
scopehub-platform = { path = "../../../crates/platform" }
scopehub-worker-host = { path = "../../../crates/worker-host" }
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
tauri = { version = "2.12.3", default-features = false, features = ["wry", "compression", "common-controls-v6"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", optional = true, default-features = false, features = ["gtk3"] }
tauri = { version = "2.12.3", optional = true, default-features = false, features = ["wry", "compression"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
tauri-build = { version = "2.7.2", optional = true , features = [] }

[lints]
workspace = true
