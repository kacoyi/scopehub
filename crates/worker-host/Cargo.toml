[package]
name = "scopehub-worker-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
scopehub-domain = { path = "../domain" }
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
serde.workspace = true
sha2 = "0.10"
scopehub-application = { path = "../application" }
uuid = { version = "1", features = ["v4"] }
tokio.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tokio-rustls = { version = "0.26", default-features = false }

[lints]
workspace = true
