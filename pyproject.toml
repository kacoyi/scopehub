[project]
name = "scopehub-workers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema[format-nongpl]>=4.23,<5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pyyaml==6.0.3",
    "types-jsonschema>=4.23,<5",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["python", "."]
explicit_package_bases = true
files = ["python", "contracts/generated/protocol.py"]
