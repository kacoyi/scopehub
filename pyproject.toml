[project]
name = "scopehub-workers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
    # The date and UUID checks are built in. Keep the backends for date-time and URI.
    "rfc3339-validator>=0.1.4,<0.2",
    "rfc3986-validator>=0.1.1,<0.2",
    # Local CSV timestamps must use the same IANA rules on Windows and Linux.
    "tzdata>=2026.5",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "psutil>=7.1,<8",
    "pyyaml==6.0.3",
    "types-jsonschema>=4.23,<5",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["python", "."]
explicit_package_bases = true
files = ["python", "contracts/generated/protocol.py"]
