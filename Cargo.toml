[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/worker-host", "apps/desktop/src-tauri"]
default-members = ["crates/domain", "crates/application", "crates/worker-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.58", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
