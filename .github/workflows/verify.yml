name: Verify delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Validation scope; release includes packaged acceptance and the soak test
        type: choice
        options: [full, release]
        default: full

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold native build and the sequential recovery suites need time to
    # finish and upload their results. Each check retains its own deadline.
    timeout-minutes: ${{ inputs.profile == 'release' && 180 || matrix.os == 'windows-latest' && 45 || 30 }}
    env:
      SCOPEHUB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.24'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned chart-test browser on Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the pinned chart-test browser on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pnpm exec playwright install chromium
          probe_chromium() {
            pnpm exec playwright screenshot --browser chromium about:blank "$RUNNER_TEMP/scopehub-chromium-probe.png"
          }
          if ! probe_chromium; then
            pnpm exec playwright install-deps chromium
            probe_chromium
          fi
      - name: Preserve accepted history
        env:
          SCOPEHUB_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPEHUB_CHECKPOINT_BASE: ${{ github.event.before }}
        run: uv run python scripts/project.py history
      - name: Initialize CI verification reports
        id: reports
        run: uv run --no-sync python scripts/ci_artifacts.py prepare
      - name: Fetch the reviewed public publisher advisory
        # The dependency check fails on missing evidence. Keep other check reports available.
        continue-on-error: true
        timeout-minutes: 1
        env:
          SCOPEHUB_PUBLISHER_ADVISORY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exec .venv/Scripts/python.exe -I -S scripts/publisher_advisory.py
          fi
          exec .venv/bin/python -I -S scripts/publisher_advisory.py
      - if: runner.os != 'Windows'
        run: pnpm check
      - if: runner.os == 'Windows' && inputs.profile != 'release'
        run: uv run python scripts/check.py --require-windows
      - if: runner.os == 'Windows' && inputs.profile == 'release'
        run: uv run python scripts/check.py --profile release --require-windows
      - name: Stage current verification evidence
        id: artifacts
        if: always() && steps.reports.outcome == 'success'
        run: uv run --no-sync python scripts/ci_artifacts.py stage
      - if: always() && steps.artifacts.outcome == 'success' && steps.artifacts.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: ${{ steps.artifacts.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
